[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enterprise-rag-assistant-backend"
version = "0.1.0"
description = "Backend service for the Enterprise RAG Assistant learning project"
requires-python = ">=3.11,<3.13"
dependencies = [
    "alembic>=1.18.5,<2.0",
    "asyncpg>=0.30,<1.0",
    "fastapi>=0.115,<1.0",
    "langchain-core>=1.5,<2.0",
    "langchain-openai>=1.4,<2.0",
    "langgraph>=1.0,<2.0",
    "pypdf>=5.9,<7.0",
    "pgvector>=0.5,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "python-docx>=1.2,<2.0",
    "python-multipart>=0.0.20,<1.0",
    "sqlalchemy[asyncio]>=2.0.51,<2.1",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
embedding = [
    "httpx[socks]>=0.27,<1.0",
    "sentence-transformers>=5.6,<6.0",
]
embedding-download = [
    "modelscope>=1.39,<2.0",
]
evaluation = [
    # RAGAS 0.4.3 仍依赖 0.4.2 已移除的兼容模块，因此固定该传递依赖版本。
    "langchain-community==0.4.1",
    "ragas>=0.4,<1.0",
]
ocr = [
    # OCR 仅在显式处理扫描版 PDF 时加载，普通解析和检索不依赖这些组件。
    "paddlepaddle>=3.0,<4.0",
    "paddleocr>=3.0,<4.0",
    "pypdfium2>=4.30,<5.0",
]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
